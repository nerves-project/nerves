version: 2.1

latest: &latest
  pattern: "^1.20.*-erlang-29.*$"

# Test across Elixir versions
tags: &tags
  [
    1.20.3-erlang-29.0.5-alpine-3.24.1,
    1.19.5-erlang-28.5.0.3-alpine-3.24.1,
    1.18.4-erlang-28.5.0.2-alpine-3.23.4,
    1.18.4-erlang-27.3.4.14-alpine-3.24.1,
    1.17.3-erlang-27.3.4.16-alpine-3.24.1
  ]

# Test across Ubuntu versions
ubuntu_tags: &ubuntu_tags
  [
    1.20.2-erlang-29.0.3-ubuntu-resolute-20260707,
    1.20.2-erlang-29.0.3-ubuntu-noble-20260610,
    1.20.2-erlang-29.0.3-ubuntu-jammy-20260627,
  ]

# Test across macOS versions
macos_xcode_versions: &macos_xcode_versions
  [
    "26.6",
    "16.4.0"
  ]

jobs:
  check-license:
    docker:
      - image: fsfe/reuse:latest
    steps:
      - checkout
      - run: reuse lint

  build-test:
    parameters:
      tag:
        type: string
    docker:
      - image: hexpm/elixir:<< parameters.tag >>
    working_directory: ~/repo
    environment:
      LC_ALL: C.UTF-8
    steps:
      - run:
          name: Install system dependencies
          command: apk add --no-cache build-base git procps util-linux xz zstd
      - checkout
      - run:
          name: Install hex, rebar, and nerves_bootstrap
          command: |
            mix local.hex --force
            mix local.rebar --force
            mix archive.install hex nerves_bootstrap --force
      - restore_cache:
          keys:
            - v1-mix-cache-<< parameters.tag >>-{{ checksum "mix.lock" }}
      - run: mix deps.get
      - when:
          condition:
            matches: { <<: *latest, value: << parameters.tag >> }
          steps:
            - run: mix format --check-formatted
            - run: mix deps.unlock --check-unused
            - run: mix test
            - run: mix docs
            - run: mix credo -a --strict
            - run: mix dialyzer
            - run: mix hex.build
      - when:
          condition:
            not:
              matches: { <<: *latest, value: << parameters.tag >> }
          steps:
            - run: mix test
      - save_cache:
          key: v1-mix-cache-<< parameters.tag >>-{{ checksum "mix.lock" }}
          paths:
            - _build
            - deps

  ubuntu-build-test:
    parameters:
      tag:
        type: string
    docker:
      - image: hexpm/elixir:<< parameters.tag >>
    working_directory: ~/repo
    environment:
      LC_ALL: C.UTF-8
    steps:
      - run:
          name: Install system dependencies
          command: |
            apt-get update -qq
            apt-get install -y build-essential procps libsctp1 ca-certificates zstd
      - checkout
      - run: mix local.hex --force
      - run: mix archive.install hex nerves_bootstrap --force
      - run: mix deps.get
      - run: mix test

  macos-test:
    parameters:
      xcode:
        type: string
    macos:
      xcode: << parameters.xcode >>
    resource_class: macos.m1.medium.gen1
    working_directory: ~/repo
    environment:
      LC_ALL: C.UTF-8
    steps:
      - checkout
      - run:
          name: Install Elixir
          command: |
            brew update
            brew install elixir fwup
            mix local.hex --force
            mix archive.install hex nerves_bootstrap --force
      - run: mix deps.get
      - run: mix test

  ubuntu-integration-test:
    machine:
      image: ubuntu-2604:current
    working_directory: ~/repo
    environment:
      LC_ALL: C.UTF-8
    steps:
      - checkout
      - run:
          name: Install tooling
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y elixir build-essential
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix archive.install hex nerves_bootstrap --force
      - run: mix deps.get
      - run: mix coveralls.circle --include integration --import-cover cover

  automerge:
    docker:
      - image: alpine:3.23.4
    steps:
      - run:
          name: Install GitHub CLI
          command: apk add --no-cache build-base github-cli
      - run:
          name: Attempt PR automerge
          command: |
            author=$(gh pr view "${CIRCLE_PULL_REQUEST}" --json author --jq '.author.login' || true)

            if [ "$author" = "app/dependabot" ]; then
              gh pr merge "${CIRCLE_PULL_REQUEST}" --auto --rebase || echo "Failed trying to set automerge"
            else
              echo "Not a dependabot PR, skipping automerge"
            fi

workflows:
  checks:
    jobs:
      - check-license:
          filters:
            tags:
              only: /.*/
      - build-test:
          name: << matrix.tag >>
          matrix:
            parameters:
              tag: *tags
      - ubuntu-build-test:
          name: << matrix.tag >>
          matrix:
            parameters:
              tag: *ubuntu_tags
      - macos-test:
          name: macos-xcode-<< matrix.xcode >>
          matrix:
            parameters:
              xcode: *macos_xcode_versions
      - ubuntu-integration-test

      - automerge:
          requires: *tags
          context: org-global
          filters:
            branches:
              only: /^dependabot.*/
